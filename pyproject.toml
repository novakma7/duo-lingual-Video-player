[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "duolingual-player"
version = "0.1.0"
description = "Dvoujazyčný MKV přehrávač se dvěma nezávislými audio výstupy"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6-Essentials>=6.7,<7",
    "av>=12,<16",
    "numpy>=1.26,<3",
    "sounddevice>=0.5,<1",
    "charset-normalizer>=3.3,<4",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
duolingual-player = "duolingual_player.app:main"

[tool.setuptools.packages.find]
include = ["duolingual_player*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
